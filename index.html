<!doctype html><n<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D졌DAY</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7ff;color:#24365d;font-family:Arial,'Malgun Gothic',sans-serif}.wrap{max-width:1050px;margin:22px auto;padding:14px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-size:27px;font-weight:900;color:#477df0}.tag{color:#8390aa;font-size:13px}.btn{border:0;border-radius:12px;background:#477df0;color:white;padding:11px 15px;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.card{background:white;border-radius:22px;padding:18px;box-shadow:0 8px 30px #526ca51a}.month{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:bold;margin-bottom:12px}.month button,.small{border:0;background:#eef3ff;color:#477df0;border-radius:9px;padding:8px;cursor:pointer}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week div{text-align:center;color:#8995ad;padding:7px;font-size:12px}.day{height:94px;border:1px solid #edf0f8;border-radius:10px;padding:5px;overflow:hidden}.day.muted{opacity:.35}.num{font-size:12px;font-weight:bold;margin-bottom:4px}.ev{display:block;border:0;border-radius:6px;padding:4px;margin:2px 0;width:100%;text-align:left;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.exam{background:#e8f1ff;color:#2866cb}.class{background:#e4f8f2;color:#218b72}.birthday{background:#fff0f5;color:#d34d7c}.etc{background:#f0eaff;color:#7856c8}.item{display:block;width:100%;text-align:left;background:white;border:1px solid #e8edf7;border-radius:12px;padding:11px;margin:7px 0;cursor:pointer;color:#24365d}.mutedtxt{color:#8793aa;font-size:12px}.modal{display:none;position:fixed;inset:0;background:#14234488;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.box{background:white;border-radius:20px;padding:22px;width:min(470px,100%);max-height:90vh;overflow:auto}.box input,.box textarea,.box select{width:100%;padding:10px;border:1px solid #dfe6f3;border-radius:9px;margin:5px 0 12px}.box textarea{min-height:65px}.row{margin:10px 0;background:#f6f8fd;padding:12px;border-radius:10px}.tip{background:#fff5dd;padding:13px;border-radius:12px;margin-top:12px}.close{float:right;border:0;background:#eef2fa;padding:8px 12px;border-radius:9px;cursor:pointer}@media(max-width:720px){.grid{grid-template-columns:1fr}.day{height:76px;padding:3px}.ev{font-size:8px;padding:3px}.wrap{padding:9px}}
</style></head><body><div class="wrap"><header class="head"><div><div class="brand">📅 D졌DAY</div><div class="tag">우리 반의 모든 날을 한눈에!</div></div><button class="btn" onclick="openAdd()">＋ 일정 추가</button></header>
<div class="grid"><section class="card"><div class="month"><span id="month"></span><span><button class="small" onclick="shift(-1)">‹</button> <button class="small" onclick="shift(1)">›</button></span></div><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="days" id="days"></div></section>
<aside class="card"><h3>다가오는 우리 반 일정 ✨</h3><div id="upcoming"></div><p class="mutedtxt">일정을 누르면 제출기한, 제출방법, 내용과 꿀팁을 확인할 수 있어요.</p><button class="small" onclick="filter='all';draw()">전체 일정</button> <button class="small" onclick="filter='exam';draw()">수행평가</button> <button class="small" onclick="filter='birthday';draw()">생일</button> <button class="small" onclick="filter='class';draw()">학급 일정</button></aside></div></div>
<div class="modal" id="detail"><div class="box"><button class="close" onclick="hide('detail')">닫기 ✕</button><h2 id="title"></h2><div class="mutedtxt" id="date"></div><div id="fields"></div><div class="tip"><b>✨ AI 꿀팁</b><p id="tip"></p></div></div></div>
<div class="modal" id="add"><form class="box" id="form"><button type="button" class="close" onclick="hide('add')">닫기 ✕</button><h2>일정 추가</h2>일정 이름<input id="name" required placeholder="예: 과학 수행평가 / 민지 생일">날짜<input id="day" type="date" required>종류<select id="type"><option value="exam">수행평가</option><option value="class">학급 일정</option><option value="birthday">생일</option><option value="etc">기타</option></select>제출기한<input id="deadline" placeholder="예: 23:59 / 종례 시간">제출방법<input id="method" placeholder="예: 클래스룸 김병길">내용<textarea id="content" placeholder="준비물, 자세한 내용"></textarea>AI 꿀팁<textarea id="advice" placeholder="준비 팁"></textarea><button class="btn" style="width:100%">저장하기</button></form></div>
<script>
const now=new Date();let shown=new Date(now.getFullYear(),now.getMonth(),1),filter='all';
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let data=[{date:key(new Date(now.getFullYear(),now.getMonth(),5)),name:'국어 논술 수행',type:'exam',deadline:'2026. 11. 5. 23:59',method:'클래스룸 김병길',content:'논술문 작성하기 · 근거 3가지 정리',tip:'주장과 근거를 먼저 메모한 뒤 글을 쓰면 좋아요.'},{date:key(new Date(now.getFullYear(),now.getMonth(),9)),name:'수학 수행평가',type:'exam',deadline:'수업 시간',method:'선생님께 직접 제출',content:'문제 풀이 과정 정리 및 발표',tip:'답뿐 아니라 풀이 과정을 단계별로 정리해 보세요.'},{date:key(new Date(now.getFullYear(),now.getMonth(),13)),name:'영어 말하기 수행',type:'exam',deadline:'오후 5시',method:'클래스룸 제출 후 발표',content:'영어 자기소개 1분 발표',tip:'키워드 중심으로 연습하고 소리 내어 읽어 보세요.'},{date:key(new Date(now.getFullYear(),now.getMonth(),16)),name:'자리 바꾸는 날',type:'class',deadline:'아침 조회',method:'교실에서 진행',content:'새로운 자리와 짝꿍 확인!',tip:'새로운 친구와 즐겁게 지내 봐요.'},{date:key(new Date(now.getFullYear(),now.getMonth(),20)),name:'서연이 생일 🎂',type:'birthday',deadline:'종일',method:'축하 한마디 전하기',content:'우리 반 서연이 생일!',tip:'진심을 담아 축하해 주세요.'},{date:key(new Date(now.getFullYear(),now.getMonth(),24)),name:'학급 회의',type:'class',deadline:'종례 시간',method:'교실',content:'다음 달 학급 행사 아이디어 나누기',tip:'좋은 의견을 한 가지 생각해 와요.'}];
try{data=JSON.parse(localStorage.getItem('djday')||'null')||data}catch(e){}
function draw(){document.getElementById('month').textContent=shown.getFullYear()+'년 '+(shown.getMonth()+1)+'월';let start=new Date(shown);start.setDate(1-start.getDay());let out='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let k=key(d);out+='<div class="day '+(d.getMonth()!=shown.getMonth()?'muted':'')+'"><div class="num">'+d.getDate()+'</div>'+data.filter(x=>x.date===k).map(x=>'<button class="ev '+x.type+'" onclick="detail('+data.indexOf(x)+')">'+x.name+'</button>').join('')+'</div>'}document.getElementById('days').innerHTML=out;let list=data.filter(x=>(filter==='all'||x.type===filter)&&x.date>=key(now)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8);document.getElementById('upcoming').innerHTML=list.map(x=>'<button class="item" onclick="detail('+data.indexOf(x)+')"><b>'+x.name+'</b><div class="mutedtxt">'+x.date+'</div></button>').join('')||'<p class="mutedtxt">일정이 없어요.</p>'}
function shift(n){shown.setMonth(shown.getMonth()+n);draw()}function detail(i){let x=data[i];document.getElementById('title').textContent=x.name;document.getElementById('date').textContent=x.date;document.getElementById('fields').innerHTML=[['제출기한 / 시간',x.deadline],['제출 방법',x.method],['내용 / 준비물',x.content]].map(r=>'<div class="row"><small>'+r[0]+'</small><div>'+r[1]+'</div></div>').join('');document.getElementById('tip').textContent=x.tip||'일정을 미리 확인하고 차근차근 준비해 보세요.';document.getElementById('detail').classList.add('open')}
function openAdd(){document.getElementById('day').value=key(shown);document.getElementById('add').classList.add('open')}function hide(id){document.getElementById(id).classList.remove('open')}
document.getElementById('form').onsubmit=e=>{e.preventDefault();data.push({name:name.value,date:day.value,type:type.value,deadline:deadline.value,method:method.value,content:content.value,tip:advice.value});localStorage.setItem('djday',JSON.stringify(data));e.target.reset();hide('add');draw()};
draw();
</script></body></html>
